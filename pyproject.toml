[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcore"
version = "0.1.1"
description = "共享算法层 - 技术指标、绩效指标等纯函数库"
requires-python = ">=3.10"
authors = [
    { name = "wolfjkd", email = "wolfjkd@users.noreply.github.com" }
]
license = "MIT"
keywords = ["quantitative", "finance", "technical indicators", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/wolfjkd/quantcore"
Repository = "https://github.com/wolfjkd/quantcore"

[project.scripts]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
pythonpath = ["."]

[tool.pytest-benchmark]
warmup = false
min_rounds = 5
max_rounds = 50

[tool.coverage.run]
source = ["quantcore"]

[tool.coverage.report]
show_missing = true
fail_under = 80